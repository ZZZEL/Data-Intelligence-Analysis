<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="数据智能分析工具统一演示。" />
    <title>数据智能分析工具</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script>
      // Set the token scope before the first paint. The launcher repeats this
      // check when it loads a mode, avoiding a flash of the wrong shell.
      (function setInitialMode() {
        var hash = window.location.hash || "";
        var opsRoute = /^#\/?(?:knowledge|local-documents|enterprise-connections|external-information|models|retrieval-config|retrieval-test|api-access|consumption)(?:[/?]|$)/;
        document.documentElement.dataset.demoMode = opsRoute.test(hash) ? "ops" : "client";
      })();
    </script>
    <link rel="stylesheet" href="assets/css/tokens.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <div class="boot-screen" role="status">
        <span class="boot-mark" aria-hidden="true"></span>
        <span>正在载入数据智能分析工具…</span>
      </div>
    </div>
    <!-- Both modes share these mounting points; only the active mode renders. -->
    <div id="session-menu-root"></div>
    <div id="dialog-root"></div>
    <div id="overlay-root"></div>
    <div id="toast-root" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <noscript>请启用 JavaScript 以运行此演示。</noscript>

    <script src="assets/vendor/lucide.min.js"></script>
    <script src="src/launcher.js?v=20260916-search-dialog-5"></script>
  </body>
</html>
