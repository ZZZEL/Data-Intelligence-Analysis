<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Revision Design QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 20px; background: #eef1f5; font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #101828; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      figure { margin: 0; padding: 12px; background: #fff; border: 1px solid #dfe3e8; border-radius: 8px; }
      figcaption { margin-bottom: 10px; font-weight: 650; }
      img { display: block; width: 100%; height: auto; border: 1px solid #eef1f5; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>参考方案 1</figcaption><img src="../design/reference-option-1.png" alt="参考方案 1" /></figure>
      <figure><figcaption>修订后运营概览</figcaption><img src="../audit-20260825-revision/final/01-overview-viewport.png" alt="修订后运营概览" /></figure>
    </main>
  </body>
</html>
